```html
<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =========================================================
       BASIC PAGE SETTINGS
  ========================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- CHANGE PAGE TITLE HERE -->
  <title>Boba Bay — Order Online</title>

  <!-- CHANGE PAGE DESCRIPTION HERE -->
  <meta
    name="description"
    content="Boba, milkshakes, slushies and fizzy drinks. Order online via WhatsApp."
  >


  <!-- =========================================================
       FONTS
       Usually you do NOT need to change this.
  ========================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================================
       CSS
       Change style2.css if you rename your CSS file.
  ========================================================== -->

  <link rel="stylesheet" href="style2.css">

</head>


<body>


  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header class="site-header">

    <div class="wrap bar">


      <!-- RESTAURANT LOGO + NAME -->

      <a
        class="brand"
        href="index.html"
        aria-label="Home"
      >

        <!-- CHANGE LOGO ICON HERE -->
        <span class="logo" aria-hidden="true">
          🐻
        </span>

        <!-- CHANGE RESTAURANT NAME HERE -->
        <span data-bind="name">
          Boba Bay
        </span>

      </a>


      <!-- HOME BUTTON -->

      <div class="actions">

        <a
          class="btn btn-primary btn-sm"
          href="index.html"
        >
          Home
        </a>

      </div>

    </div>

  </header>



  <!-- =========================================================
       MAIN ORDER PAGE
  ========================================================== -->

  <main class="wrap">

    <section class="section">


      <!-- PAGE TITLE -->

      <h1 class="page-title">
        Order Online
      </h1>


      <!-- PAGE INTRODUCTION -->
      <!-- CHANGE THIS TEXT IF NEEDED -->

      <p class="sub">
        Tap <strong>Add to Cart</strong> on a drink.
        Most drinks can be customised with boba and toppings.
        Open your cart to choose Delivery or Pickup and send
        your order via WhatsApp.
      </p>



      <!-- =====================================================
           CATEGORY NAVIGATION

           Categories are automatically created by script2.js.
           DO NOT add menu categories here.
      ====================================================== -->

      <div class="cat-nav-holder">

        <nav
          id="catNav"
          class="cat-nav"
          aria-label="Menu categories"
        ></nav>

      </div>



      <!-- =====================================================
           MENU

           script2.js automatically puts the menu here.
      ====================================================== -->

      <div id="menuRoot"></div>


    </section>

  </main>



  <!-- =========================================================
       FOOTER
  ========================================================== -->

  <footer class="site-footer">

    <p class="copy">

      ©
      <span id="year"></span>

      <span data-bind="name">
        Boba Bay
      </span>

      . All prices in Tanzanian Shillings.

    </p>

  </footer>



  <!-- =========================================================
       FLOATING CART BUTTON
  ========================================================== -->

  <button
    id="cart-toggle-btn"
    class="cart-fab"
    type="button"
    aria-label="Open cart, 0 items"
  >

    🛒 Cart

    <span
      id="cart-count"
      class="cart-fab-count"
      aria-hidden="true"
    >
      0
    </span>

  </button>



  <!-- =========================================================
       CART BACKGROUND OVERLAY
  ========================================================== -->

  <div
    id="cart-overlay"
    class="cart-overlay"
    hidden
  ></div>



  <!-- =========================================================
       CART DRAWER
  =======================================
