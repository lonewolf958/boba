<!DOCTYPE html>
<html lang="en" data-title="Table Menu">

<head>
  <!-- ========================================
       1. PAGE SETTINGS
  ========================================= -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Boba Bear — Table Menu</title>

  <meta
    name="description"
    content="Boba, milkshakes, slushies and fizzy drinks. View our menu or order online via WhatsApp."
  >


  <!-- ========================================
       2. GOOGLE FONTS
  ========================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ========================================
       3. TABLE MENU STYLESHEET
  ========================================= -->
  <link rel="stylesheet" href="style1.css">

</head>

<body>

  <!-- ========================================
       4. HEADER / NAVIGATION
  ========================================= -->

  <header class="site-header">

<div class="header-inner">

  <!-- Restaurant Logo -->
  <div class="brand-logo">
    <img
      src="logo.jpeg"
      alt="Boba Bay"
    />
  </div>

  <!-- Restaurant Name -->
  <div class="brand-copy">
    <p class="brand-eyebrow"></p>

    <h1 class="brand-name">
      Boba Bay
    </h1>

    <p class="brand-tagline">
      Ride the Wave of FLavor.
    </p>
  </div>

  <!-- Home Button -->
  <a
    href="index.html"
    class="home-button"
    aria-label="Go back to home page"
  >
    🏠 Home
  </a>

</div>


  </header>
  <!-- ========================================
       5. MAIN MENU CONTENT
  ========================================= -->
  <main class="wrap">

    <section class="section" style="padding-top: 24px;">

      <!-- Menu Category Navigation -->
      <div class="cat-nav-holder">

        <nav
          id="catNav"
          class="cat-nav"
          aria-label="Menu categories"
        ></nav>

      </div>


      <!-- Menu Items Rendered by JavaScript -->
      <div id="menuRoot"></div>

    </section>

  </main>


  <!-- ========================================
       6. FOOTER
  ========================================= -->
  <footer class="site-footer">

    <p class="copy">
      © <span id="year"></span>
      <span data-bind="name"></span>.
      All prices in Tanzanian Shillings.
    </p>

  </footer>


  <!-- ========================================
       7. TABLE MENU JAVASCRIPT
  ========================================= -->
  <script src="script1.js"></script>

</body>
</html>
