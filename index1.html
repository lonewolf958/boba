<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Boba Bay — Table Menu</title>

  <meta
    name="description"
    content="Boba, milkshakes, slushies and fizzy drinks. View our menu or order online via WhatsApp."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style1.css">
</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">

    <div class="header-inner">

      <a class="brand" href="index1.html" aria-label="Boba Bay home">

        <img
          class="brand-logo"
          src="logo.jpeg"
          alt="Boba Bay"
        >

        <div class="brand-copy">

          <div class="brand-name">
            Boba Bay
          </div>

          <div class="brand-tagline">
            Ride the Wave of FLavor.
          </div>

        </div>

      </a>

      <a class="home-button" href="index.html">
        🏠 Home
      </a>

    </div>

  </header>


  <!-- =========================================================
       CATEGORY NAVIGATION
       ========================================================= -->

  <div class="cat-nav-holder">

    <nav
      id="catNav"
      class="cat-nav"
      aria-label="Menu categories"
    ></nav>

  </div>


  <!-- =========================================================
       MENU
       ========================================================= -->

  <main class="wrap">

    <div
      id="menuRoot"
      aria-live="polite"
    ></div>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="site-footer">

    <div class="copy">
      © <span id="year"></span> Boba Bay.
      All prices in Tanzanian Shillings.
    </div>

  </footer>


  <script src="script1.js"></script>

</body>
</html>
